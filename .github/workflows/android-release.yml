name: Android Release (Signed APK → GitHub Release)

# Пуш тега формата v*.*.*-Ru автоматически собирает официально подписанный пакет и публикует Release.
# Именно latest официальный Release, опубликованный здесь, читает «Проверка обновлений» внутри приложения:
#   - Release должен быть официальным (не draft / не prerelease)
#   - среди активов должен быть ровно один .apk (UpdateChecker берёт первый актив с расширением .apk)
on:
  push:
    tags:
      - 'v*.*.*-Ru'
  # Разрешён ручной перезапуск: достаточно выбрать на странице Actions какой-либо tag в качестве ref для запуска,
  # GITHUB_REF_NAME по-прежнему будет именем тега, а артефакты полностью совпадут с теми, что при пуше тега.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Защита от забытого изменения номера версии: tag должен совпадать с versionName в build.gradle.kts,
      # иначе проверка обновлений внутри приложения определит версию неверно
      - name: Preflight — tag must match versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DECLARED=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG_VERSION versionName=$DECLARED"
          if [ "$TAG_VERSION" != "$DECLARED" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) does not match versionName ($DECLARED). Bump the version in app/build.gradle.kts and tag that commit."
            exit 1
          fi

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew --no-daemon testDebugUnitTest -x buildRustLibs

      - name: Decode signing keystore
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease -x buildRustLibs
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"

      - name: Rename APK and compute SHA-256
        run: |
          # Имя артефакта следует уже принятому в этом репозитории соглашению (ранее — TS6_Droid_Ru-2.1.5.apk):
          # убираем префикс v у tag и суффикс -Han, получаем TS6_Droid_Ru-<версия>.apk
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%-Ru}"
          NAME="TS6_Droid_Ru-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pick release notes
        id: notes
        run: |
          # Каждый тег может сопровождаться вручную написанным описанием выпуска: release-notes/<tag>.md
          # Если его нет, используется приведённый ниже общий текст — выпуск не упадёт из-за отсутствия файла.
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "Using $NOTES"
          else
            echo "No $NOTES; falling back to the generic body"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TS6 Droid Ru v${{ env.VERSION }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          # Если body_path пуст, action откатывается к body
          body_path: ${{ steps.notes.outputs.path }}
          body: |
            TS6 Droid упрощённая китайская версия ${{ github.ref_name }}

            - Официально подписанный установочный пакет: `${{ env.ASSET }}` (можно устанавливать поверх предыдущей версии)
            - Контрольная сумма SHA-256 находится в одноимённом файле `.sha256`
            - Ключевые изменения этой версии см. в [списке изменений README](https://github.com/${{ github.repository }}/blob/main/README.md#更新日志)
            - Данный tag соответствует полному исходному коду (GPLv3)
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
