name: Android Release (Signed APK → GitHub Release)

# 推送 v*.*.*-Han 格式的 tag 自动构建正式签名包并发布 Release。
# 应用内「检查更新」读取的就是这里发布的 latest 正式 Release：
#   - Release 必须是正式发布（非 draft / 非 prerelease）
#   - 资产里有且仅有一个 .apk（UpdateChecker 取第一个以 .apk 结尾的资产）
on:
  push:
    tags:
      - 'v*.*.*-Han'
  # 允许手动重跑：在 Actions 页面选择某个 tag 作为 ref 触发即可，
  # GITHUB_REF_NAME 仍然是 tag 名，产物与推送 tag 完全一致。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 防止忘改版本号：tag 必须与 build.gradle.kts 里的 versionName 一致，
      # 否则应用内检查更新会判错版本
      - name: Preflight — tag must match versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DECLARED=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG_VERSION versionName=$DECLARED"
          if [ "$TAG_VERSION" != "$DECLARED" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) does not match versionName ($DECLARED). Bump the version in app/build.gradle.kts and tag that commit."
            exit 1
          fi

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew --no-daemon testDebugUnitTest -x buildRustLibs

      - name: Decode signing keystore
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease -x buildRustLibs
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"

      - name: Rename APK and compute SHA-256
        run: |
          # 资产名沿用本仓库既有约定（此前为 TS6_Droid_Han-2.1.5.apk）：
          # 去掉 tag 的 v 前缀与 -Han 后缀，得到 TS6_Droid_Han-<版本>.apk
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%-Han}"
          NAME="TS6_Droid_RU_APP-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pick release notes
        id: notes
        run: |
          # 每个标签可以带一份手写发行说明：release-notes/<tag>.md
          # 没有就用下面的通用正文，发版不会因为缺文件失败。
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "Using $NOTES"
          else
            echo "No $NOTES; falling back to the generic body"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TS6 Droid Ru v${{ env.VERSION }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          # body_path 为空时 action 会退回 body
          body_path: ${{ steps.notes.outputs.path }}
          body: |
            TS6 Droid Русская версия ${{ github.ref_name }}

            - Официально подписанный установочный пакет: ${{ env.ASSET }} (можно устанавливать поверх предыдущей версии)
            - Контрольная сумма SHA-256 находится в одноимённом файле .sha256
            - Ключевые изменения этой версии см. в [списке изменений README](https://github.com/${{ github.repository }}/blob/main/README.md#Список изменений)
            - Данный tag соответствует полному исходному коду (GPLv3)）
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
